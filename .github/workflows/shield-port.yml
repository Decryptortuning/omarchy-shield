name: Shield port checks

on:
  push:
    branches: [codex/shield-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install check tools
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck pacman-package-manager lua5.4 device-tree-compiler
      - name: Check Shield build scripts
        run: |
          python3 ports/shield/validate-inputs.py
          bash -n ports/shield/mesa-shield/PKGBUILD
          shellcheck -s bash -e SC2034,SC2154 ports/shield/mesa-shield/PKGBUILD
          shellcheck bin/omarchy-hw-aarch64-shield ports/shield/*.sh ports/shield/tools/*.sh ports/shield/omarchy-shield/lifecycle test/shell.d/shield-platform-test.sh
          shellcheck -s sh ports/shield/diagnostic/*.sh ports/shield/stock-bootstrap/*.sh ports/shield/ramdisk/init
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          for path in Path('ports/shield').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          for path in Path('ports/shield').rglob('*.json'):
              json.loads(path.read_text())
          PY
      - name: Exercise platform integration
        run: |
          python3 -m unittest discover -s ports/shield/tests
          for suite in shield-platform hw-platform platform-packages pacman-templates lifecycle-dispatch image-target-platform image-deferred-hardware hyprland-startup-cursor; do
            bash "test/shell.d/$suite-test.sh"
          done
  windows-inventory-parser:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check binary inventory framing without a device
        shell: powershell
        run: |
          & .\ports\shield\tests\check-stock-collector.ps1 `
            -Collector "$env:GITHUB_WORKSPACE\ports\shield\tools\collect-stock-inventory.ps1" `
            -WorkDirectory "$env:RUNNER_TEMP\shield-inventory-parser"
